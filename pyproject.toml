[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-phishield"
version = "0.1.0"
description = "Explainable phishing email detection: atomic semantic signals from a local System 1 decision model plus deterministic header/URL checks, combined by logistic regression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["phishing-detection", "email-security", "explainable-ai", "fraud-detection", "laya"]
dependencies = ["laya>=0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/laya_phishield"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
