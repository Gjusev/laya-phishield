[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-phishield"
version = "0.1.0"
description = "Explainable phishing email detection: atomic semantic signals from a local System 1 decision model plus deterministic header/URL checks, combined by logistic regression"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Gjusev" }]
keywords = ["phishing-detection", "email-security", "explainable-ai", "fraud-detection", "laya"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = ["laya>=0.3", "scikit-learn>=1.3", "fastapi>=0.110"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
eval = ["openai>=1.40"]
demo = ["streamlit>=1.35"]

[project.scripts]
laya-phishield = "laya_phishield.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_phishield"]

[tool.pytest.ini_options]
pythonpath = ["src", "evals"]
testpaths = ["tests"]
markers = [
    "slow: loads a real laya checkpoint (network download); run explicitly with -m slow",
]
addopts = "-m 'not slow'"

[project.urls]
Homepage = "https://github.com/Gjusev/laya-phishield"
Repository = "https://github.com/Gjusev/laya-phishield"
Issues = "https://github.com/Gjusev/laya-phishield/issues"
Changelog = "https://github.com/Gjusev/laya-phishield/releases"
